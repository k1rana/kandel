name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# Supersede in-flight runs for the same ref: once a newer push lands, the older
# run's result is moot, so cancel it instead of burning a runner to completion.
# Scoping the group to `github.ref` keeps branches and PRs from cancelling each
# other.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  rust:
    name: Rust tests and lints
    runs-on: windows-latest
    # A cold windows run (no cargo cache) is the slow case; this is a generous
    # ceiling that only trips on a genuine hang.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      # The pnpm version is pinned by `packageManager` in the root package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          # The workspace lockfile lives at the repository root, not beside the
          # frontend package.
          cache-dependency-path: pnpm-lock.yaml

      - name: Build the frontend
        # The UI binary embeds `frontend/dist` at compile time, so the frontend
        # has to be built before any Rust target that includes it. Only `vite
        # build` is needed here — the `build` script also runs `svelte-check`,
        # which the `frontend` job already covers.
        run: |
          pnpm install --frozen-lockfile
          pnpm --dir crates/kandel-ui/frontend exec vite build

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

  frontend:
    name: Frontend tests and checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # The pnpm version is pinned by `packageManager` in the root package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      # Install from the workspace root: the frontend is a workspace package,
      # so a root install creates the node_modules the scripts expect.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm --dir crates/kandel-ui/frontend check

      - name: Test
        run: pnpm --dir crates/kandel-ui/frontend test

      - name: Build
        run: pnpm --dir crates/kandel-ui/frontend exec vite build
