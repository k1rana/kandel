name: Release

# Cuts releases with semantic-release: it derives the next version from
# Conventional Commits, bumps the single-source version in Cargo.toml, builds
# both binaries, and publishes the GitHub release with its assets.
#
# `main` cuts stable releases and commits the bump back (tagged `[skip ci]`, so
# this workflow does not re-fire). `N.x-dev` branches cut `next` pre-releases
# and do *not* commit the bump — the version is transient there, so dev branches
# never conflict with `main` on the Cargo.toml version line. See
# `release.config.cjs` for the per-branch behaviour.
#
# Publishing happens here in CI — never locally. The version is written by
# `scripts/release/prepare.mjs`; nothing in the repo declares it twice.
#
# WinGet is a job *in this workflow*, not a separate release-triggered workflow:
# the default GITHUB_TOKEN cannot start another workflow from the release it
# creates, so a `release: [released]` trigger would silently never fire.

on:
  push:
    # `main` for stable releases; any `N.x-dev` for next pre-releases.
    branches: [main, '+([0-9]).x-dev']
  workflow_dispatch:
    inputs:
      release_type:
        description: 'Release type (auto = follow conventional commits)'
        type: choice
        required: true
        default: auto
        options:
          - auto
          - major
          - minor
          - patch

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  verify:
    name: Verify
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      # The pnpm version is pinned by `packageManager` in the root package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The UI binary embeds `frontend/dist` at compile time, so the frontend
      # has to be built before any Rust target that includes it.
      - name: Build the frontend
        run: pnpm --dir crates/kandel-ui/frontend build

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

  release:
    name: Release
    runs-on: windows-latest
    needs: verify
    permissions:
      contents: write # create the release, the tag, and push the version bump
      issues: write # comment on issues resolved by the release
      pull-requests: write
    outputs:
      released: ${{ steps.semantic.outputs.released }}
      version: ${{ steps.semantic.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          # semantic-release needs the full history and every tag to work out
          # the last release and the commits since it.
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          # arm64 is cross-compiled from the x64 runner, so its target has to be
          # installed here. The arm64 MSVC linker the image already provides is
          # what `link.exe` picks up for `aarch64-pc-windows-msvc`.
          targets: aarch64-pc-windows-msvc

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # NSIS (downloaded by `tauri build`) and the packaging zip both need a
      # Windows host, which this runner provides. `prepare.mjs` builds and
      # packages both architectures (x64 natively, arm64 cross) at the version
      # semantic-release computed.
      - name: Release
        id: semantic
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TYPE: ${{ inputs.release_type }}
          # Signs the NSIS installers so the in-app updater can verify them.
          # Secret, never committed; a release without it produces unsigned
          # artifacts and `scripts/release/manifest.mjs` refuses to run.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npx semantic-release

  winget:
    name: Publish to WinGet
    runs-on: ubuntu-latest
    needs: release
    # Opt-in: skip until the package exists in WinGet and WINGET_TOKEN is set.
    # The very first submission to WinGet is manual; flip the `WINGET_ENABLED`
    # repository variable to `true` once the package is live there. Without this,
    # every early release would show a failing job for a package WinGet does not
    # have yet.
    #
    # Stable releases only: a `N.x-dev` run cuts a `next` pre-release, which must
    # never reach the WinGet package users install from.
    if: >-
      needs.release.outputs.released == 'true' &&
      vars.WINGET_ENABLED == 'true' &&
      github.ref == 'refs/heads/main'
    steps:
      # NOTE: this can only *update* an existing WinGet package. The very first
      # submission for `Tojoo.Kandel` must be made by hand to
      # microsoft/winget-pkgs; after that this job keeps it current.
      - uses: vedantmgoyal9/winget-releaser@main
        with:
          identifier: Tojoo.Kandel
          version: ${{ needs.release.outputs.version }}
          # Only the NSIS installers are WinGet packages; the portable ZIPs are
          # not. The regex matches both architectures' installers, and the action
          # reads the `x64`/`arm64` in each file name as its Architecture.
          installers-regex: 'windows-(x64|arm64)-setup\.exe$'
          max-versions-to-keep: 5
          token: ${{ secrets.WINGET_TOKEN }}
